[project]
name = "taifeng"
version = "2026.6.21.21"
description = "让 LLM 自主调度文档化 skill 的 Python agent 微内核 —— 动 agent 的天地气"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Taifeng Contributors" },
]
keywords = ["llm", "agent", "skill", "orchestration", "compression"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # 仅引擎核心需要的依赖。业务侧 (provider SDK / DB / cache 后端) 由宿主项目按需引入
    "pydantic>=2.7",
    "anyio>=4.4", # 跨 asyncio / trio 取消语义
    "httpx>=0.27", # provider 适配层默认 HTTP 客户端
    "pyyaml>=6.0", # SKILL.md frontmatter 解析
    "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
google = ["google-genai>=0.3"]
litellm = ["litellm>=1.50"]  # 多 provider 统一适配（推荐）
# OTel 出口（业务侧按需 ``uv pip install -e ".[telemetry-otel]"``；不放默认依赖）
telemetry-otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # examples/web_ui/ demo 的运行时依赖（demo only，不进生产）
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taifeng"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "S", "B", "C4", "RET", "SIM", "TCH"]
ignore = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
