[project]
name = "taifeng"
version = "2026.9.6.0"
description = "让 LLM 自主调度文档化 skill 的 Python agent 微内核 —— 动 agent 的天地气"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Taifeng Contributors" },
]
keywords = ["llm", "agent", "skill", "orchestration", "compression"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # 仅引擎核心需要的依赖。业务侧 (provider SDK / DB / cache 后端) 由宿主项目按需引入
    "pydantic>=2.7",
    "anyio>=4.4", # 跨 asyncio / trio 取消语义
    "httpx>=0.27", # provider 适配层默认 HTTP 客户端
    "pyyaml>=6.0", # SKILL.md frontmatter 解析
    "rfc8785>=0.1.4,<1",
    "sniffio>=1.3", # projection backend identity 的直接运行时依赖
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
google = ["google-genai>=0.3"]
litellm = ["litellm>=1.50"]  # 多 provider 统一适配（推荐）
# OTel 出口（业务侧按需 ``uv pip install -e ".[telemetry-otel]"``；不放默认依赖）
telemetry-otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
dev = [
    "packaging>=24", # 发行产物 PEP 508 metadata 校验
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    # examples/web_ui/ demo 的运行时依赖（demo only，不进生产）
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taifeng"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "S", "B", "C4", "RET", "SIM", "TCH"]
# S101(裸 assert)全局放行。原注释写的是「allow assert in tests」——不准确:真正
# 依赖它的是 src/,那里 68 处里 66 处是 mypy strict 要求的类型收窄
# (assert x is not None / assert isinstance(...)),断的是内部不变量而非外部输入,
# 被 python -O 剥掉也只是让同一处改抛 AttributeError/TypeError;另 2 处在 sim
# conformance server(测试基建,只是打包在 src/ 内)。改写成 if-raise 只会增加
# 永不执行的分支,故保持放行。**外部输入校验一律走 LLMError/DispatchVerdict,不用 assert。**
ignore = ["S101"]

[tool.ruff.lint.flake8-type-checking]
# 告诉 ruff:继承 pydantic.BaseModel 的类,其注解在**运行时**被解析
# (pydantic 建模型时就要拿到真类型),这些 import 不能挪进 TYPE_CHECKING。
# 不配这条,TC001/TC003 会把它们判成"仅类型用"并建议挪走 —— 挪了就是运行时炸。
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# S108(硬编码 /tmp):tests/ 里的 /tmp 全是**占位字符串**,不落盘 ——
# SkillDefinition.body_path(body 已内联)、ScriptDescriptor.path(构造即 raise 的
# 校验用例)、PermissionRule.target_pattern(纯 glob 字符串比较)。
# 唯一真落盘的那处(shell 注入用例的攻击落点)已改用 tmp_path fixture。
# src/ examples/ scripts/ 不放行 —— 生产代码硬编码 /tmp 是真隐患(符号链接攻击)。
"tests/**" = ["S108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
